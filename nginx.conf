server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets — long cache
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Dice assets — long cache
    location /dice-assets/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Don't cache the entry HTML
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
