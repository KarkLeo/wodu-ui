server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — the generated shell serves every client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output — long cache. A missing file must be a 404, not the
    # SPA shell, or a stale client would receive HTML in place of a JS chunk.
    location /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # App manifest: latest.json is not hashed and changes every deploy, so
    # clients must revalidate it (meta/ is keyed by build id, revalidating is cheap)
    location ^~ /_nuxt/builds/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # Dice assets — long cache
    location /dice-assets/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Don't cache the entry HTML
    location ~ ^/(index|200|404)\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Don't cache the service worker — browsers must always revalidate it
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
    }

    # Don't cache the web manifest aggressively
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }
}
